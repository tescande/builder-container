bind-key / copy-mode \; send-key C-r
set -g history-limit 10000

set -g mouse on
# sane scrolling:
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

bind -n S-PgUp 'copy-mode -e; send-keys PgUp'
bind -n S-PgDn 'copy-mode -e; send-keys PgDn'

bind-key -rn S-Up    select-pane -U
bind-key -rn S-Down  select-pane -D
bind-key -rn S-Left  select-pane -L
bind-key -rn S-Right select-pane -R

bind-key -rn M-S-Left  previous-window
bind-key -rn M-S-Right next-window
